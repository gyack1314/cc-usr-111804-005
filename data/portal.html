<!doctype html><html lang="zh"><meta charset="utf-8"><title>训练场次演练页</title>
<body><h1>训练场次资料</h1><button type="button" id="switch">切换</button>
<div id="card">场次 A 设备表</div><pre id="state"></pre>
<script>
let state={scope:"场次 A",card_scope:"场次 A",phase:'loaded'};
const show=()=>document.querySelector('#state').textContent=JSON.stringify(state);
show();
document.querySelector('#switch').onclick=()=>{
  state.scope="场次 B"; state.phase='pending'; show();
  setTimeout(()=>{state.card_scope=state.scope; state.phase='loaded';
    document.querySelector('#card').textContent="场次 B 设备表"; show();},300);
};
</script></body></html>
